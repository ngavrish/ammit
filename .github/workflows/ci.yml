# ammit is the watchdog. A break here is not caught by a run failing - it is
# caught by runs NOT being caught, which is the failure that hides.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [server, clients/go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        working-directory: ${{ matrix.module }}
      - run: go build ./...
        working-directory: ${{ matrix.module }}
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      - run: go test ./...
        working-directory: ${{ matrix.module }}
      - name: golangci-lint against the baseline
        if: matrix.module == 'server'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
          PATH="$(go env GOPATH)/bin:$PATH" python3 tools/golint.py --require
        working-directory: .

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.6
      - run: ruff check src tools

  # The server, alive. Every job above proves the code compiles and that the
  # panels' SQL parses; none of them proves the service answers, and the three
  # things checked here - the comparison, the search and the record - each pass
  # in isolation while being wrong in the wiring. So: build the binary, start it
  # against a scratch sqlite, post two runs through the Python client, and ask.
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The allowlist is a promise about a sender that lives in another
      # repository, and tools/record_check.py can only keep it if it can read
      # that sender. Fetched here when this workflow is allowed to reach it,
      # by token or by the file being public. When it cannot, the checker
      # prints WARN lines and the job goes on: a watchdog whose CI cannot see
      # the runner is still worth running against the clients, as long as
      # nobody reads its green as having checked the runner.
      - name: the runner's runsdb.py, when this workflow can reach it
        env:
          RUNNER_REPO_TOKEN: ${{ secrets.AGENTIC_V_MODEL_TOKEN }}
        run: |
          url=https://raw.githubusercontent.com/ngavrish/agentic-v-model/main/services/agent-runner/runsdb.py
          out="$RUNNER_TEMP/runsdb.py"
          auth=()
          if [ -n "$RUNNER_REPO_TOKEN" ]; then
            auth=(-H "Authorization: Bearer $RUNNER_REPO_TOKEN")
          fi
          if curl -fsSL "${auth[@]}" "$url" -o "$out"; then
            echo "RUNSDB=$out" >>"$GITHUB_ENV"
            echo "the runner's runsdb.py is here; record_check.py checks it"
          else
            echo "could not fetch runsdb.py; record_check.py will WARN and check the clients"
          fi
      - run: bash tools/live_check.sh
