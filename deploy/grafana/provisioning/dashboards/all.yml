apiVersion: 1
providers:
  - name: ammit
    type: file
    # Dashboards arrive from files so a fresh install has them, and can be edited
    # in the interface afterwards: a chart nobody can change is a chart nobody
    # adds to, and the questions worth asking about a run are not all known in
    # advance. Saving in the UI keeps the change; the file is the starting point,
    # not the ceiling.
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
