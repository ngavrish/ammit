# Ammit beside the thing it weighs. Two containers, one config file, one sqlite
# file — deliberately less machinery than whatever it is judging.
services:
  ammit:
    build: ..
    ports: ["8099:8099"]
    environment:
      AMMIT_TICK: "20"
      AMMIT_DRY_RUN: "${AMMIT_DRY_RUN:-0}"
      # Where the page sends you for the charts.
      AMMIT_CHARTS_URL: "${AMMIT_CHARTS_URL:-http://localhost:3301}"
    volumes:
      # Writable: the limits are edited on ammit's own page, and this file is
      # what it reads.
      - ./limits.yml:/config/limits.yml
      - ammit-data:/data
      # How it restarts what it watches. Drop this line and the container
      # actions become no-ops; webhook actions still work.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3301:3000"]
    environment:
      # The page frames these charts as its own tab. Without this Grafana sends
      # X-Frame-Options: deny and the tab is a blank rectangle.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_USERS_DEFAULT_THEME: dark
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ammit.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Grafana's own top bar, with a rule added to hide it. Grafana's
      # template, not ours — pulled from the shipped image so an upgrade is a
      # diff against a real file, not a guess at what changed underneath it.
      - ./grafana/index.html:/usr/share/grafana/public/views/index.html:ro
      - ammit-data:/data:ro
      - grafana-data:/var/lib/grafana
    depends_on: [ammit]
    restart: unless-stopped

volumes:
  ammit-data:
  grafana-data:
