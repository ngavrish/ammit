# Ammit beside the thing it weighs. Two containers, one config file, one sqlite
# file — deliberately less machinery than whatever it is judging.
services:
  ammit:
    build: ..
    ports: ["8099:8099"]
    environment:
      AMMIT_TICK: "20"
      AMMIT_DRY_RUN: "${AMMIT_DRY_RUN:-0}"
    volumes:
      - ./limits.yml:/config/limits.yml:ro
      - ammit-data:/data
      # How it restarts what it watches. Drop this line and the container
      # actions become no-ops; webhook actions still work.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3301:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ammit.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ammit-data:/data:ro
      - grafana-data:/var/lib/grafana
    depends_on: [ammit]
    restart: unless-stopped

volumes:
  ammit-data:
  grafana-data:
