[project]
name = "ammit"
version = "0.1.0"
description = "Weigh a long-running agent pipeline against its limits from outside it: timeouts at every level, cost caps, a queue, and a dashboard of what was crossed and what happened next"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "BoberIT"}]
keywords = ["agents", "watchdog", "limits", "observability", "pipeline"]
dependencies = []

# Two questions a terminal is the right place for: what changed between two
# runs, and where a word appears in the record. `python -m ammit` is the same
# entry, for anybody who has the package but not the script on their path.
[project.scripts]
ammit = "ammit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ammit"]

# Same families as the pipeline repo, for the same reason: a rule earns its
# place here by naming a way this service can stop answering. ammit going
# quiet is worse than ammit being wrong - a watchdog nobody hears is a
# watchdog that is not there.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "BLE", "B", "S110", "S112", "PLR2004", "F", "E9"]
ignore = ["TRY003"]
