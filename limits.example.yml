# Every limit in one file, in one vocabulary. Seconds unless the name says
# otherwise. Zero means no limit — and writing zero is a decision somebody made
# rather than a gap somebody left. Re-read every tick, so a limit can be changed
# while a run is going, which is exactly when anyone wants to.

queue:
  parallel: 1              # runs allowed at once

timeouts:
  run: 14400               # the whole thing
  phase: 5400              # one phase
  session: 3600            # one agent session
  # One wait for the model: ask, and get an answer back. The only limit that
  # can catch a call that never returns, because nothing inside the process
  # notices — there is no error to log and no retry to fire.
  request: 900
  turn: 600                # one exchange — the hang nothing inside the run catches

retention:
  # Finished runs older than this move into archive/ammit-YYYY-MM.db and leave
  # the live database small. Nothing is deleted: an archive is a database like
  # any other, and ATTACH brings an old run back when somebody asks.
  days: 30
  dir: /data/archive

limits:
  usd_per_run: 150
  turns_per_run: 4000
  # Megabytes, per container. A worker that swells until the kernel kills it
  # leaves no evidence behind, because the process that would have said so is
  # the one that died — so the reading is taken from out here.
  memory_mb: 6000

sample:
  every: 60                # seconds between readings of memory and cpu
  containers: ""           # only containers whose name contains this; "" is all

# The names below refer to the commands underneath, so this service never needs
# to know whether it is watching a container, a pod or a process.
actions:
  on_run_timeout: stop_run
  on_usd: stop_run
  on_phase_timeout: stop_phase
  on_session_timeout: retry_session
  # The run went quiet everywhere. Whatever spoke last is what stopped speaking,
  # so aim at that session; only when the last thing said names no agent is
  # there nothing left but restarting the container.
  on_turn_timeout: retry_session
  on_turn_timeout_blind: restart_worker
  on_request_timeout: retry_session
  on_memory: warn
  on_start: start_run

# {run}, {name}, {phase}, {agent}, {session} and anything under `context` are
# substituted before the command runs.
commands:
  warn: /bin/true
  restart_worker: docker restart {worker}
  # Kill switches the runner checks between messages: it stops where nothing is
  # half-done, rather than being shot mid-tool-call. Removing the lock file was
  # what this used to do, and it stopped nothing — the run kept spending, and
  # the ticket merely became free for another run to claim on top of it.
  stop_run: docker exec {worker} sh -c "touch /runs/{name}/.cancel"
  stop_phase: docker exec {worker} sh -c "touch /runs/{name}/.cancel.phase.{phase}"
  # A file cannot interrupt a process that is waiting on a model, and that is
  # the one wait worth interrupting. These call the worker's control handle, so
  # the session ends inside the second rather than whenever the call returns.
  stop_session: curl -sS -X POST {control} -d '{"scope":"session","id":"{agent}","run":"{name}","action":"stop"}'
  stop_session_file: docker exec {worker} sh -c "touch /runs/{name}/.cancel.session.{agent}"
  stop_branch: docker exec {worker} sh -c "touch /runs/{name}/.cancel.branch.{branch}"
  # And the other half: start that one thing again instead of abandoning it.
  # Fires once — the runner eats the marker — and gives up after RUN_RETRY_MAX
  # attempts, because a retry that never gives up is the same outage with more
  # billing.
  retry_phase: docker exec {worker} sh -c "touch /runs/{name}/.retry.phase.{phase}"
  retry_branch: docker exec {worker} sh -c "touch /runs/{name}/.retry.branch.{branch}"
  retry_session: curl -sS -X POST {control} -d '{"scope":"session","id":"{agent}","run":"{name}","action":"retry"}' 
  # The payload is quoted here, not in the template's user: unquoted, the shell
  # eats the JSON's own quotes and the request arrives as {key:APF-1934}.
  start_run: curl -sS -X POST {starter} -H "Content-Type: application/json" -d '{payload}' 

context:
  worker: my-pipeline-worker-1
  starter: http://orchestrator:8081/run
  control: http://agent-runner:9099/cancel
